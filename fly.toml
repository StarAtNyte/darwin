# Fly.io deploy: `flyctl deploy` from this directory. One machine stays up so the economy keeps evolving between visits.
app = "near-darwin"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DARWIN_DB = "/tmp/darwin.sqlite"
  AUTO_RESTART_SEC = "120"
  AUTO_RESUME_SEC = "300"
  PUBLIC_MODE = "1"
  # Start at seed 1 and count up after each run: seeds 1-5 first replay the committed Claude answers in
  # results/mutations/, then every cache miss (a visitor's shock, or seeds past 5) asks the free open model live.
  SEED = "1"
  DARWIN_MUTATION = "mixed"
  # Free OpenAI-compatible mutation operator (NVIDIA NIM). The key is a secret: fly secrets set MUTATION_API_KEY=...
  # Claude is never called in public mode (no DARWIN_PUBLIC_ANTHROPIC).
  MUTATION_BASE_URL = "https://integrate.api.nvidia.com/v1"
  MUTATION_MODEL = "mistralai/mistral-large-4-1t-a52b"
  MUTATION_REASONING_EFFORT = "low"
  MUTATION_RPM = "30"
  MUTATION_TIMEOUT_SEC = "90"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
