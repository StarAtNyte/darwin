# Render blueprint: dashboard.render.com -> New -> Blueprint -> pick this repo -> Apply.
# Free plan: sleeps after ~15 min idle and the in-memory run restarts on wake; the public run is shared,
# so steering is locked (PUBLIC_MODE) and finished runs restart on their own.
services:
  - type: web
    name: near-darwin
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DARWIN_DB
        value: /tmp/darwin.sqlite
      - key: PUBLIC_MODE
        value: "1"
      - key: AUTO_RESTART_SEC
        value: "120"
      - key: AUTO_RESUME_SEC
        value: "300"
      # Replay Claude's recorded run (results/mutations/seed-3-llm.json, claude-haiku-5-5): every child's genome
      # and one-line reason come from the recording, so no model is called. Restarts cycle through seeds 1-5,
      # the seeds with a recording. A visitor's shock moves the run off the recording; later children are random.
      - key: DARWIN_MUTATION
        value: llm
      - key: SEED
        value: "3"
