name: ci
on: [push, pull_request]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd sim && npm ci && npm test && npx tsc --noEmit
      - name: server boots and answers
        run: |
          cd sim && (PORT=8787 TICKS=50 npx tsx src/main.ts &) && sleep 8
          curl -fsS 127.0.0.1:8787/healthz
          curl -fsS -XPOST 127.0.0.1:8787/api/shock -d '{"kind":"drought"}' > /dev/null
          curl -fsS 127.0.0.1:8787/api/export/genome | grep -q darwin-genome/1
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cd contract && cargo test --quiet && make build
