name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cd sim && npm ci
      # The same command the README gives: sim tests, typecheck, contract tests.
      - run: make test
      - run: make contract
      # No key on the runner: seeds and the wind tunnel are Gaussian and the ablation replays the committed Claude
      # answers, so all three must regenerate the committed results byte for byte.
      - name: results reproduce without a key
        run: |
          make seeds > /dev/null
          make ablation > /dev/null
          make windtunnel > /dev/null
          git diff --exit-code results/
      - name: server boots and answers
        run: |
          cd sim && (PORT=8787 TICKS=50 node --import tsx src/main.ts &) && sleep 8
          curl -fsS 127.0.0.1:8787/healthz
          curl -fsS -XPOST 127.0.0.1:8787/api/shock -d '{"kind":"drought"}' > /dev/null
          curl -fsS 127.0.0.1:8787/api/export/genome | grep -q darwin-genome/1
